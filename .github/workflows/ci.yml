name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: KAIORXKit tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build and test (local, deterministic, no provider access)
        run: swift test --package-path Packages/KAIORXKit
