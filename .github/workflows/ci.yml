name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: KAIORXKit tests
    # The app and the package build with the macOS 26 SDK or newer (Xcode 26+).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build and test (local, deterministic, no provider access)
        run: swift test --package-path Packages/KAIORXKit
