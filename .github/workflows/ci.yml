name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: KAIORXKit tests
    # Same toolchain as development (Xcode 27, Swift 6.4); the image is a GitHub preview.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build and test (local, deterministic, no provider access)
        run: swift test --package-path Packages/KAIORXKit
