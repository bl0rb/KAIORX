<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="KAIORX Constellation K">
<defs>
 <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#040c24"/><stop offset=".57" stop-color="#091b43"/><stop offset="1" stop-color="#1e0641"/></linearGradient>
 <linearGradient id="blue" x1="0" x2=".95" y1="1" y2="0"><stop stop-color="#14e7ff"/><stop offset=".55" stop-color="#4bbaff"/><stop offset="1" stop-color="#b4b5ff"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#83d9ff"/><stop offset=".45" stop-color="#958eff"/><stop offset="1" stop-color="#f45ef6"/></linearGradient>
 <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#42f8ff"/><stop offset=".5" stop-color="#72b8ff"/><stop offset="1" stop-color="#d954fa"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#3f67ff" stop-opacity=".75"/><stop offset=".5" stop-color="#173be3" stop-opacity=".2"/><stop offset="1" stop-color="#100c46" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
 <rect x="16" y="16" width="992" height="992" rx="220" fill="url(#bg)"/>
 <ellipse cx="604" cy="220" rx="280" ry="170" fill="url(#halo)" opacity=".35"/>
 <g opacity=".56" fill="#a9d7ff">
 <circle cx="161" cy="228" r="2.2"/><circle cx="827" cy="194" r="2.7"/><circle cx="139" cy="602" r="1.8"/><circle cx="858" cy="623" r="2.5"/><circle cx="456" cy="147" r="1.6"/><circle cx="632" cy="807" r="1.7"/>
 <circle cx="753" cy="125" r="1.7"/><circle cx="242" cy="829" r="2.5"/><circle cx="915" cy="489" r="1.5"/>
 </g>
 <!-- faint lower planetary horizon -->
 <path d="M32 929 Q507 750 1000 840 L1000 1000 L32 1000Z" fill="#0e1740" opacity=".49"/>
 <path d="M80 953 Q512 778 977 861" fill="none" stroke="url(#orbit)" stroke-width="6" opacity=".52"/>
 <!-- structural K: faceted, radiant tech symbol -->
 <g opacity=".72" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M323 257 L323 737" stroke="#1ae9ff" stroke-width="17"/>
 <path d="M478 516 L617 290 L747 290" stroke="#77bbff" stroke-width="15"/>
 <path d="M482 520 L624 715 L751 715" stroke="#ef64ff" stroke-width="15"/>
 </g>
 <path d="M323 257 L323 737" stroke="url(#blue)" stroke-width="12" stroke-linecap="round"/>
 <path d="M323 257 L478 516 L323 737" fill="none" stroke="#5bdfff" stroke-width="5" opacity=".7"/>
 <path d="M478 516 L617 290 L747 290" stroke="url(#blue)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
 <path d="M478 516 L624 715 L751 715" stroke="url(#pink)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
 <path d="M478 516 L323 737" fill="none" stroke="#30bfff" stroke-width="4" opacity=".7"/>
 <!-- orbital path, positioned to read on small surfaces -->
 <ellipse cx="520" cy="522" rx="419" ry="130" transform="rotate(-15 520 522)" fill="none" stroke="url(#orbit)" stroke-width="13" opacity=".65" filter="url(#soft)"/>
 <ellipse cx="520" cy="522" rx="419" ry="130" transform="rotate(-15 520 522)" fill="none" stroke="url(#orbit)" stroke-width="7"/>
 <g fill="white">
 <circle cx="323" cy="257" r="23"/><circle cx="323" cy="737" r="23"/><circle cx="747" cy="290" r="23"/><circle cx="751" cy="715" r="23"/><circle cx="478" cy="516" r="29"/>
 </g>
 <g opacity=".65" filter="url(#soft)"><circle cx="323" cy="257" r="32" fill="#25cfff"/><circle cx="323" cy="737" r="32" fill="#27dfff"/><circle cx="747" cy="290" r="32" fill="#ea51fb"/><circle cx="751" cy="715" r="32" fill="#ea51fb"/><circle cx="478" cy="516" r="40" fill="#64c5ff"/></g>
 <rect x="17" y="17" width="990" height="990" rx="220" fill="none" stroke="url(#orbit)" stroke-width="3" opacity=".55"/>
</svg>